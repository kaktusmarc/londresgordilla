<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Londres en 3 días · Itinerario</title>
<meta name="description" content="Itinerario visual interactivo de 3 días en Londres: mapa, tiempos a pie y fotos de cada parada.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <span class="brand__kicker" id="tripDates"></span>
      <h1 class="brand__title">Londres <em>en 3 días</em></h1>
    </div>
    <a class="hotel-chip" id="hotelChip" target="_blank" rel="noopener">
      <span class="hotel-chip__icon" aria-hidden="true">&#127976;</span>
      <span class="hotel-chip__text"></span>
    </a>
  </div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Días del viaje"></nav>
</header>

<main class="layout" id="layout">

  <section class="map-pane" aria-label="Mapa del itinerario">
    <div id="map"></div>
    <button class="map-reset" id="mapReset" type="button" title="Ver el día completo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
      <span>Ver el día</span>
    </button>
  </section>

  <section class="list-pane" aria-label="Paradas del día">
    <div class="day-head" id="dayHead"></div>
    <ol class="timeline" id="timeline"></ol>
    <footer class="credits">
      <p>Rutas a pie: <a href="https://project-osrm.org/" target="_blank" rel="noopener">OSRM</a> ·
         Mapa: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> ·
         Fotos: <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia</a></p>
      <p class="credits__note">Los tiempos son orientativos: cuentan solo el paseo, no las colas ni las paradas.</p>
    </footer>
  </section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
